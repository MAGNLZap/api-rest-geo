<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Servicios de Desarrollo Infantil - Ecuador</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Nunito',sans-serif;background:#f0f2f5}
#map{width:100%;height:100%}
.panel{position:absolute;top:20px;left:20px;z-index:1000;background:white;padding:20px;width:280px;border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,.12);max-height:calc(100vh - 40px);overflow-y:auto}
.panel-header{display:flex;align-items:center;gap:10px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #eee}
.panel-icon{width:36px;height:36px;background:linear-gradient(135deg,#5B2A86,#3D1A6E);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.panel-icon svg{width:20px;height:20px}
.panel h2{font-size:16px;font-weight:700;color:#1a1a2e;line-height:1.2;font-family:'Fredoka',sans-serif}
.panel-sub{font-size:11px;color:#888;margin-top:2px}
.section-title{font-size:11px;font-weight:600;color:#aaa;text-transform:uppercase;letter-spacing:.5px;margin:14px 0 8px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0}
.toggle-row label{font-size:13px;color:#444;cursor:pointer;display:flex;align-items:center;gap:8px}
.toggle{position:relative;width:40px;height:22px;appearance:none;-webkit-appearance:none;background:#ccc;border-radius:11px;cursor:pointer;transition:.2s;outline:none;border:none;flex-shrink:0}
.toggle:checked{background:#5B2A86}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;background:white;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle:checked::after{left:20px}
.region-dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex-shrink:0}
.btn{width:100%;padding:10px;border:none;background:linear-gradient(135deg,#5B2A86,#3D1A6E);color:white;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;font-family:inherit;transition:opacity .2s;margin-top:8px}
.btn:hover{opacity:.9}
.stats{margin-top:14px;padding-top:12px;border-top:1px solid #eee}
.stats-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0}
.stats-label{font-size:12px;color:#888}
.stats-value{font-size:13px;font-weight:600;color:#1a1a2e}
.loading-bar{width:100%;height:3px;background:#e0e0e0;border-radius:2px;overflow:hidden;margin-top:10px}
.loading-bar::after{content:'';display:block;width:40%;height:100%;background:linear-gradient(90deg,#5B2A86,#3D1A6E);border-radius:2px;animation:loading 1s ease-in-out infinite}
@keyframes loading{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
.leaflet-popup-content-wrapper{border-radius:12px!important;box-shadow:0 8px 32px rgba(0,0,0,.15)!important;padding:0!important;overflow:hidden}
.leaflet-popup-content{margin:0!important}
.leaflet-popup-content.cluster-popup{min-width:0!important;width:auto!important}
.leaflet-popup-tip{box-shadow:0 4px 12px rgba(0,0,0,.1)!important}
.marker-pin{transition:transform .2s,filter .2s;cursor:pointer}
.marker-pin:hover{transform:scale(1.15);filter:brightness(1.1)}
.cluster-pin{transition:transform .2s}
.cluster-pin:hover{transform:scale(1.1)}
.cluster-pin:hover{transform:scale(1.1)}
.popup-card{font-family:'Nunito',sans-serif}
.popup-header{padding:14px 16px 10px;background:linear-gradient(135deg,#5B2A86,#3D1A6E);color:white}
.popup-header h3{font-size:14px;font-weight:600;line-height:1.3;margin:0}
.popup-header .popup-tag{display:inline-block;background:rgba(255,255,255,.25);padding:2px 8px;border-radius:4px;font-size:11px;margin-top:6px;font-weight:500}
.popup-body{padding:12px 16px}
.popup-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #f5f5f5;font-size:12px}
.popup-row:last-child{border-bottom:none}
.popup-row .label{color:#888;font-weight:500}
.popup-row .value{color:#1a1a2e;font-weight:600;text-align:right;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.popup-link{display:inline-block;padding:8px 20px;text-align:center;color:white;text-decoration:none;font-size:12px;font-weight:700;transition:opacity .2s;border:none;border-radius:6px;cursor:pointer;font-family:inherit}
.popup-link:hover{opacity:.85}
.popup-cluster{padding:0;overflow:hidden}
.popup-cluster-header{background:linear-gradient(135deg,#5B2A86,#3D1A6E);padding:14px 16px 10px;color:white;text-align:center}
.popup-cluster-count{font-size:36px;font-weight:700;line-height:1;color:white}
.popup-cluster-label{font-size:13px;font-weight:600;opacity:.9;margin-top:4px}
.popup-cluster-body{padding:12px 16px;text-align:center}
.popup-cluster-hint{font-size:11px;color:#888;line-height:1.4}
</style>
</head>
<body>
<div class="panel">
    <div class="panel-header">
        <div class="panel-icon"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L12 22"/><path d="M2 12L22 12"/><circle cx="12" cy="12" r="10"/></svg></div>
        <div><h2>Unidades de Atención</h2><div class="panel-sub">Servicios de Desarrollo Infantil · Ecuador</div></div>
    </div>
    <div class="section-title">Datos</div>
    <div class="toggle-row"><label for="clusterToggle"><span class="region-dot" style="background:#5B2A86"></span>Agrupar puntos</label><input type="checkbox" class="toggle" id="clusterToggle" checked></div>
    <button class="btn" onclick="reloadData()">Recargar datos</button>
    <div id="loadingIndicator"><div class="loading-bar"></div></div>
    <div class="stats" id="statsContent" style="display:none">
        <div class="stats-row"><span class="stats-label">Visibles</span><span class="stats-value" id="visibleCount">0</span></div>
        <div class="stats-row"><span class="stats-label">Total</span><span class="stats-value" id="totalCount">0</span></div>
        <div class="stats-row"><span class="stats-label">Zoom</span><span class="stats-value" id="zoomLevel">0</span></div>
    </div>
</div>
<div id="map"></div>
<div style="position:absolute;bottom:20px;left:20px;z-index:1000;background:rgba(255,255,255,.85);padding:6px 12px;border-radius:8px;font-size:11px;color:#888;font-family:Nunito,sans-serif;backdrop-filter:blur(4px);box-shadow:0 2px 8px rgba(0,0,0,.08)">Datos: Ministerio de Desarrollo Humano · Servicios de Desarrollo Infantil · Mapas: Google</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/supercluster@8/dist/supercluster.min.js"></script>
<script src="https://unpkg.com/@turf/turf@7/turf.min.js"></script>
<script>
const ROOT=window.location.pathname.replace(/\/demo\/?$/,'');
const API=ROOT+"/unidades";
const map=L.map("map",{zoomControl:false,minZoom:6,maxZoom:20});
L.control.zoom({position:'bottomright'}).addTo(map);
L.tileLayer("https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}",{maxZoom:20,attribution:'© Google'}).addTo(map);
map.setView([-1.83,-78.18],7);

const maskLayer=L.layerGroup().addTo(map);
const outlineLayer=L.layerGroup().addTo(map);
const markersLayer=L.layerGroup().addTo(map);

const ECUADOR_GEOJSON_URL="https://raw.githubusercontent.com/jpmarindiaz/geo-collection/master/ecu/ecuador.geojson";

const regionKeys=['costa','sierra','amazonia','galapagos'];

const regionColors={
    costa:{fill:'#FFCD56',border:'#e6b800',label:'#b8860b',text:'rgba(0,0,0,.8)'},
    sierra:{fill:'#5C9EFF',border:'#3a7fd9',label:'#2563eb',text:'white'},
    amazonia:{fill:'#FF6978',border:'#e04858',label:'#dc2626',text:'white'},
    galapagos:{fill:'#18B2A2',border:'#128f82',label:'#0d7a6e',text:'white'}
};

const provinceRegion={};
'07,08,09,12,13,23,24'.split(',').forEach(function(c){provinceRegion[c]='costa'});
'01,02,03,04,05,06,10,11,17,18'.split(',').forEach(function(c){provinceRegion[c]='sierra'});
'14,15,16,19,21,22'.split(',').forEach(function(c){provinceRegion[c]='amazonia'});
'20'.split(',').forEach(function(c){provinceRegion[c]='galapagos'});

const regionLayers={};
regionKeys.forEach(function(k){regionLayers[k]=L.layerGroup()});

const regionNames={costa:'Costa',sierra:'Sierra',amazonia:'Amazonía',galapagos:'Galápagos'};

function getRegionKey(provCode){
    return provinceRegion[provCode]||null;
}



let ecuadorGeo=null;

async function loadEcuadorGeo(){
    try{
        const r=await fetch(ECUADOR_GEOJSON_URL);
        ecuadorGeo=await r.json();
    }catch(e){
        console.warn("Could not load Ecuador GeoJSON, using fallback");
    }
}

function buildMask(){
    maskLayer.clearLayers();
    if(!ecuadorGeo)return;
    const worldCoords=[[-90,-180],[-90,180],[90,180],[90,-180],[-90,-180]];
    const holes=[];
    ecuadorGeo.features.forEach(function(f){
        const geom=f.geometry;
        if(geom.type==="Polygon"){
            geom.coordinates.forEach(function(ring,i){
                if(i===0) holes.push(ring.map(function(c){return[c[1],c[0]]}));
            });
        }else if(geom.type==="MultiPolygon"){
            geom.coordinates.forEach(function(poly){
                poly.forEach(function(ring,i){
                    if(i===0) holes.push(ring.map(function(c){return[c[1],c[0]]}));
                });
            });
        }
    });
    if(holes.length>0){
        const maskCoords=[worldCoords,...holes];
        L.polygon(maskCoords,{color:'transparent',fillColor:'white',fillOpacity:0.8,weight:0,interactive:false}).addTo(maskLayer);
    }
}

function buildRegions(){
    regionKeys.forEach(function(k){regionLayers[k].clearLayers()});
    if(!ecuadorGeo)return;
    ecuadorGeo.features.forEach(function(f){
        const code=f.properties.dpa_provin;
        if(!code)return;
        const regionKey=provinceRegion[code];
        if(!regionKey)return;
        const color=regionColors[regionKey];
        const geom=f.geometry;
        const processRing=function(ring){return ring.map(function(c){return[c[1],c[0]]})};
        if(geom.type==="Polygon"){
            L.polygon(processRing(geom.coordinates[0]),{
                color:'white',fillColor:color.fill,fillOpacity:0.5,weight:3,opacity:0.9
            }).addTo(regionLayers[regionKey]);
        }else if(geom.type==="MultiPolygon"){
            geom.coordinates.forEach(function(poly){
                L.polygon(processRing(poly[0]),{
                    color:'white',fillColor:color.fill,fillOpacity:0.5,weight:3,opacity:0.9
                }).addTo(regionLayers[regionKey]);
            });
        }
    });
}

function buildOutline(){
    outlineLayer.clearLayers();
    if(!ecuadorGeo)return;
    try{
        let merged=null;
        ecuadorGeo.features.forEach(function(f){
            if(merged===null){
                merged=f.geometry;
            }else{
                merged=turf.union(merged,f.geometry);
            }
        });
        if(merged){
            L.geoJSON(merged,{
                style:{color:'white',weight:6,fillOpacity:0,opacity:0.95}
            }).addTo(outlineLayer);
        }
    }catch(e){
        console.warn("Could not build outline:",e);
    }
}

let allFeatures=[];
let index=new Supercluster({radius:80,maxZoom:14});
let stickyMarker=null;
let currentPopup=null;

function openPopupFor(marker,feature){
    closePopup();
    const isCluster=feature.properties.cluster;
    currentPopup=L.popup({maxWidth:320,minWidth:isCluster?0:280})
        .setLatLng(marker.getLatLng())
        .setContent(popup(feature))
        .addTo(map);
    requestAnimationFrame(function(){
        const el=currentPopup.getElement();
        if(!el)return;
        if(isCluster)el.querySelector('.leaflet-popup-content').classList.add('cluster-popup');
        const btn=el.querySelector('.popup-link');
        if(btn){
            btn.addEventListener('click',function(e){
                e.stopPropagation();
                window.open(btn.getAttribute('data-href'),'_blank');
            });
        }
    });
}

function closePopup(){
    if(currentPopup){map.closePopup(currentPopup);currentPopup=null}
}

function createMarkerIcon(){
    return L.divIcon({
        className:"marker-pin",
        iconSize:[80,80],iconAnchor:[40,40],popupAnchor:[0,-42],
        html:'<div style="display:flex;align-items:flex-start;justify-content:center;width:80px;height:80px;padding-top:40px"><svg pointer-events="none" width="28" height="38" viewBox="0 0 28 38" fill="none"><path d="M14 0C6.268 0 0 6.268 0 14c0 10.5 14 24 14 24s14-13.5 14-24C28 6.268 21.732 0 14 0z" fill="#5B2A86"/><circle cx="14" cy="13" r="7" fill="white"/><path d="M14 9v8M10 13h8" stroke="#5B2A86" stroke-width="2" stroke-linecap="round"/></svg></div>'
    });
}

function createClusterIcon(count,size){
    const r=size==='large'?22:size==='medium'?17:13;
    const fs=size==='large'?11:size==='medium'?10:9;
    return L.divIcon({
        className:"cluster-pin",
        iconSize:[r*2,r*2],iconAnchor:[r,r],
        html:'<div style="width:'+r*2+'px;height:'+r*2+'px;background:linear-gradient(135deg,#5B2A86,#3D1A6E);border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:'+fs+'px;border:2px solid white;box-shadow:0 1px 8px rgba(91,42,134,.3);font-family:Nunito,sans-serif">'+count+'</div>'
    });
}

function popup(feature){
    const p=feature.properties;
    if(p.cluster){
        return '<div class="popup-card"><div class="popup-cluster"><div class="popup-cluster-header"><div class="popup-cluster-count">'+p.point_count+'</div><div class="popup-cluster-label">unidades</div></div><div class="popup-cluster-body"><div class="popup-cluster-hint">Click para acercar</div></div></div></div>';
    }
    const regionKey=getRegionKey(p.dpa_prov);
    const region=regionKey?regionNames[regionKey]:'';
    const headerBg=regionKey?'background:'+regionColors[regionKey].fill:'background:linear-gradient(135deg,#5B2A86,#3D1A6E)';
    const headerColor=regionKey?regionColors[regionKey].text:'white';
    let rows='';
    [['RUC',p.ruc],['Modalidad',p.mod],['Servicio',p.servicio],['Provincia',p.dpa_despro],['Cantón',p.dpa_descan],['Área',p.area],['Tipo',p.tipo],['Dirigido a',p.corte]].forEach(function(f){
        if(f[1]) rows+='<div class="popup-row"><span class="label">'+f[0]+'</span><span class="value">'+f[1]+'</span></div>';
    });
    const btnBg=regionKey?regionColors[regionKey].fill:'#5B2A86';
    const dataHref=p.link_ubi?p.link_ubi.replace(/"/g,'&quot;'):'';
    let link=dataHref?('<div style="padding:8px 16px 12px;text-align:center"><button class="popup-link" data-href="'+dataHref+'" style="background:'+btnBg+'">Abrir en Google Maps</button></div>'):'';
    const regionBadge=region?('<span class="popup-tag" style="background:rgba(255,255,255,.25);color:'+regionColors[regionKey].text+';font-weight:600">'+region+'</span>'):'';
    return '<div class="popup-card"><div class="popup-header" style="'+headerBg+';color:'+headerColor+'"><h3>'+p.nombre+'</h3>'+regionBadge+'</div><div class="popup-body">'+rows+'</div>'+link+'</div>';
}

function getBBox(){const b=map.getBounds();return[b.getWest(),b.getSouth(),b.getEast(),b.getNorth()]}

function updateClusters(){
    markersLayer.clearLayers();
    closePopup();stickyMarker=null;
    const bbox=getBBox(),zoom=map.getZoom();
    const useCluster=document.getElementById("clusterToggle").checked;
    let clusters=useCluster?index.getClusters(bbox,zoom):index.getClusters(bbox,zoom).filter(function(f){return !f.properties.cluster});
    const icon=createMarkerIcon();
    clusters.forEach(function(f){
        const ll=[f.geometry.coordinates[1],f.geometry.coordinates[0]];
        let m;
        if(f.properties.cluster){
            const c=f.properties.point_count;
            const s=c>50?'large':c>10?'medium':'small';
            m=L.marker(ll,{icon:createClusterIcon(c,s)});
            m.on('mouseover',function(){m.openPopup()});
            m.on('mouseout',function(){m.closePopup()});
            m.on('click',function(){map.setView(ll,index.getClusterExpansionZoom(f.properties.cluster_id))});
            m.bindPopup(popup(f),{maxWidth:320,minWidth:0});
            m.on('popupopen',function(){var el=m.getElement();if(el){var p=el.querySelector('.leaflet-popup-content');if(p)p.classList.add('cluster-popup')}});
        }else{
            m=L.marker(ll,{icon:icon});
            m.on('mouseover',function(){
                if(stickyMarker!==m) openPopupFor(m,f);
            });
            m.on('mouseout',function(){
                if(stickyMarker!==m) closePopup();
            });
            m.on('click',function(e){
                L.DomEvent.stopPropagation(e);
                L.DomEvent.preventDefault(e);
                if(stickyMarker===m){
                    closePopup();
                    stickyMarker=null;
                }else{
                    stickyMarker=m;
                    openPopupFor(m,f);
                }
            });
        }
        markersLayer.addLayer(m);
    });
    document.getElementById('visibleCount').textContent=clusters.length;
    document.getElementById('totalCount').textContent=allFeatures.length;
    document.getElementById('zoomLevel').textContent=zoom;
}

async function loadAllData(){
    document.getElementById('loadingIndicator').style.display='block';
    document.getElementById('statsContent').style.display='none';
    try{
        const r=await fetch(API+'?limit=0');
        const j=await r.json();
        allFeatures=j.features;
        index.load(allFeatures);
        updateClusters();
        document.getElementById('loadingIndicator').style.display='none';
        document.getElementById('statsContent').style.display='block';
    }catch(e){
        document.getElementById('loadingIndicator').innerHTML='<span style="color:#ef4444;font-size:12px">Error: '+e.message+'</span>';
    }
}

async function reloadData(){
    index=new Supercluster({radius:80,maxZoom:14});
    await loadAllData();
}

document.getElementById('clusterToggle').addEventListener('change',updateClusters);
map.on('moveend',updateClusters);
map.on('zoomend',updateClusters);
map.on('click',function(){
    if(stickyMarker){closePopup();stickyMarker=null}
});

(async function init(){
    await loadEcuadorGeo();
    buildMask();
    buildOutline();
    buildRegions();
    regionKeys.forEach(function(k){map.addLayer(regionLayers[k])});
    await loadAllData();
})();
</script>
</body>
</html>

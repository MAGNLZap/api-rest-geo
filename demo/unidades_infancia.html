<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Servicios de Desarrollo Infantil - Ecuador</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="portal/assets/map-loading.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Nunito',sans-serif;background:#f0f2f5}
#map{width:100%;height:100%}
.topbar{position:absolute;top:16px;left:16px;z-index:1000;display:flex;align-items:center;gap:8px}
.topbar-brand{display:flex;flex-direction:column;align-items:center;gap:0;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);border-radius:16px;padding:10px 14px 8px;box-shadow:0 2px 12px rgba(0,0,0,.1)}
.topbar-brand-top{display:flex;align-items:center;gap:8px}
.panel-icon{width:30px;height:30px;background:linear-gradient(135deg,#5B2A86,#3D1A6E);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.panel-icon svg{width:16px;height:16px}
.topbar-brand h2{font-size:13px;font-weight:700;color:#1a1a2e;line-height:1.1;font-family:'Fredoka',sans-serif;white-space:nowrap}
.brand-loading{width:100%;height:2px;background:rgba(91,42,134,.08);border-radius:2px;overflow:hidden;margin-top:6px;display:none}
.brand-loading::after{content:'';display:block;width:40%;height:100%;background:linear-gradient(90deg,#5B2A86,#3D1A6E);border-radius:2px;animation:loading 1s ease-in-out infinite}
@keyframes loading{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
.dpa-seg{display:flex;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);border-radius:24px;padding:3px;gap:2px;box-shadow:0 2px 12px rgba(0,0,0,.1)}
.dpa-pill{position:relative;display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;cursor:pointer;font-size:12px;font-weight:600;color:#6b7280;transition:all .15s;user-select:none;white-space:nowrap}
.dpa-pill input{position:absolute;opacity:0;pointer-events:none}
.dpa-pill .region-dot{width:8px;height:8px}
.dpa-pill:hover{color:#5B2A86}
.dpa-pill.active{background:#5B2A86;color:white;box-shadow:0 2px 8px rgba(91,42,134,.3)}
.dpa-pill.active .region-dot{background:white!important}
.region-dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex-shrink:0}
.icon-btn{width:34px;height:34px;border:none;border-radius:50%;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);cursor:pointer;display:flex;align-items:center;justify-content:center;color:#5B2A86;transition:all .2s;box-shadow:0 2px 12px rgba(0,0,0,.1);flex-shrink:0}
.icon-btn:hover{background:#5B2A86;color:white}
.icon-btn:focus-visible{outline:2px solid #f5c842;outline-offset:3px}
.icon-btn svg{width:16px;height:16px}
.leaflet-popup-content-wrapper{border-radius:12px!important;box-shadow:0 8px 32px rgba(0,0,0,.15)!important;padding:0!important;overflow:hidden}
.leaflet-popup-content{margin:0!important}
.leaflet-popup-content.cluster-popup{min-width:0!important;width:auto!important}
.leaflet-popup-tip{box-shadow:0 4px 12px rgba(0,0,0,.1)!important}
.marker-pin{transition:transform .2s,filter .2s;cursor:pointer}
.marker-pin:hover{transform:scale(1.15);filter:brightness(1.1)}
.cluster-pin{transition:transform .2s}
.cluster-pin:hover{transform:scale(1.1)}
.cluster-pin:hover{transform:scale(1.1)}
.popup-card{font-family:'Nunito',sans-serif}
.popup-header{padding:14px 16px 10px;background:linear-gradient(135deg,#5B2A86,#3D1A6E);color:white}
.popup-header h3{font-size:14px;font-weight:600;line-height:1.3;margin:0}
.popup-header .popup-tag{display:inline-block;background:rgba(255,255,255,.25);padding:2px 8px;border-radius:4px;font-size:11px;margin-top:6px;font-weight:500}
.popup-body{padding:12px 16px}
.popup-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #f5f5f5;font-size:12px}
.popup-row:last-child{border-bottom:none}
.popup-row .label{color:#888;font-weight:500}
.popup-row .value{color:#1a1a2e;font-weight:600;text-align:right;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.popup-link{display:inline-block;padding:8px 20px;text-align:center;color:white;text-decoration:none;font-size:12px;font-weight:700;transition:opacity .2s;border:none;border-radius:6px;cursor:pointer;font-family:inherit}
.popup-link:hover{opacity:.85}
.popup-cluster{padding:0;overflow:hidden}
.popup-cluster-header{background:linear-gradient(135deg,#5B2A86,#3D1A6E);padding:14px 16px 10px;color:white;text-align:center}
.popup-cluster-count{font-size:36px;font-weight:700;line-height:1;color:white}
.popup-cluster-label{font-size:13px;font-weight:600;opacity:.9;margin-top:4px}
.popup-cluster-body{padding:12px 16px;text-align:center}
.popup-cluster-hint{font-size:11px;color:#888;line-height:1.4}
.dpa-legend{position:absolute;right:20px;top:20px;z-index:1000;background:rgba(255,255,255,.88);border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.1);padding:8px 12px;font-family:'Nunito',sans-serif;font-size:12px;color:#444;pointer-events:none;opacity:0;transition:opacity .15s;backdrop-filter:blur(12px)}
.dpa-legend.visible{opacity:1}
.dpa-legend .dpa-legend-label{font-size:9px;font-weight:700;color:#a5a5c0;text-transform:uppercase;letter-spacing:.6px}
.dpa-legend .dpa-legend-value{font-size:12px;font-weight:700;color:#1a1a2e;margin-top:1px}
</style>
</head>
<body>
<div class="map-loading-screen" id="mapLoading" role="status" aria-live="polite" aria-busy="true">
    <div class="map-loading-panel">
        <p class="map-loading-heading"><span class="map-loading-dot" aria-hidden="true"></span><span id="mapLoadingTitle">Preparando el mapa</span></p>
        <p class="map-loading-detail" id="mapLoadingDetail">Cargando información geográfica y capas.</p>
        <div class="map-loading-track" aria-hidden="true"><span></span></div>
        <button class="map-loading-retry" id="mapLoadingRetry" type="button" hidden>Reintentar</button>
    </div>
</div>
<script src="portal/assets/map-loading.js"></script>
<div class="topbar">
    <a class="icon-btn" href="." title="Volver a la vista principal" aria-label="Volver a la vista principal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7"/><path d="M5 9v11h14V9"/><path d="M9 20v-6h6v6"/></svg>
    </a>
    <div class="topbar-brand">
        <div class="topbar-brand-top">
            <div class="panel-icon"><svg viewBox="0 0 24 24" fill="white" stroke="none"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5S10.62 6.5 12 6.5s2.5 1.12 2.5 2.5S13.38 11.5 12 11.5z"/></svg></div>
            <h2>Unidades de Atención</h2>
        </div>
        <div class="brand-loading" id="brandLoading"></div>
    </div>
    <div class="dpa-seg">
        <label class="dpa-pill active"><span class="region-dot" style="background:#5C9EFF"></span>Provincias<input type="radio" name="dpaLevel" value="provincias" checked></label>
        <label class="dpa-pill"><span class="region-dot" style="background:#18B2A2"></span>Cantones<input type="radio" name="dpaLevel" value="cantones"></label>
        <label class="dpa-pill"><span class="region-dot" style="background:#FFCD56"></span>Parroquias<input type="radio" name="dpaLevel" value="parroquias"></label>
    </div>
    <button class="icon-btn" onclick="reloadData()" title="Recargar datos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.3"/><path d="M21 3v6h-6"/></svg></button>
</div>
<div id="map"></div>
<div class="dpa-legend" id="dpaLegend">
    <div class="dpa-legend-label" id="dpaLegendLabel">Zona</div>
    <div class="dpa-legend-value" id="dpaLegendValue">—</div>
</div>
<div style="position:absolute;bottom:20px;left:20px;z-index:1000;background:rgba(255,255,255,.85);padding:6px 12px;border-radius:8px;font-size:11px;color:#888;font-family:Nunito,sans-serif;backdrop-filter:blur(4px);box-shadow:0 2px 8px rgba(0,0,0,.08)">Datos: Ministerio de Trabajo y Desarrollo Humano · Servicios de Desarrollo Infantil · Mapas: Google</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" onerror="window.MapLoading.fail('No se pudo cargar la librería cartográfica.')"></script>
<script src="https://unpkg.com/@turf/turf@7/turf.min.js"></script>
<script>
const ROOT=window.location.pathname.replace(/\/(?:unidades_infancia|demo)\/?$/,'').replace(/\/$/,'');
const API=ROOT+"/unidades";
const map=L.map("map",{zoomControl:false,minZoom:6,maxZoom:20});
L.control.zoom({position:'bottomright'}).addTo(map);
const baseLayer=L.tileLayer("https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}",{maxZoom:20,attribution:'© Google'});
const baseTilesReady=new Promise(function(resolve){
    let settled=false;
    function finish(){if(!settled){settled=true;resolve()}}
    baseLayer.once('load',finish);
    window.setTimeout(finish,5000);
});
baseLayer.addTo(map);
map.setView([-1.83,-78.18],7);

const maskLayer=L.layerGroup().addTo(map);
const outlineLayer=L.layerGroup().addTo(map);
const markersLayer=L.layerGroup().addTo(map);

const ECUADOR_GEOJSON_URL="https://raw.githubusercontent.com/jpmarindiaz/geo-collection/master/ecu/ecuador.geojson";

const regionKeys=['costa','sierra','amazonia','galapagos'];

const regionColors={
    costa:{fill:'#FFCD56',border:'#e6b800',label:'#b8860b',text:'rgba(0,0,0,.8)'},
    sierra:{fill:'#5C9EFF',border:'#3a7fd9',label:'#2563eb',text:'white'},
    amazonia:{fill:'#FF6978',border:'#e04858',label:'#dc2626',text:'white'},
    galapagos:{fill:'#18B2A2',border:'#128f82',label:'#0d7a6e',text:'white'}
};

const provinceRegion={};
'07,08,09,12,13,23,24'.split(',').forEach(function(c){provinceRegion[c]='costa'});
'01,02,03,04,05,06,10,11,17,18'.split(',').forEach(function(c){provinceRegion[c]='sierra'});
'14,15,16,19,21,22'.split(',').forEach(function(c){provinceRegion[c]='amazonia'});
'20'.split(',').forEach(function(c){provinceRegion[c]='galapagos'});

const regionNames={costa:'Costa',sierra:'Sierra',amazonia:'Amazonía',galapagos:'Galápagos'};

const dpaConfig={
    provincias:{url:ROOT+"/dpa/provincias",prop:'name',label:'Provincia'},
    cantones:{url:ROOT+"/dpa/cantones",prop:'name',label:'Cantón'},
    parroquias:{url:ROOT+"/dpa/parroquias",prop:'name',label:'Parroquia'}
};

const legendEl=document.getElementById('dpaLegend');
const legendLabelEl=document.getElementById('dpaLegendLabel');
const legendValueEl=document.getElementById('dpaLegendValue');

const dpaLayers={};
const dpaData={};
let activeDpa='provincias';

function getDpaStyle(feature){
    const region=provinceRegion[feature.properties.province_id||feature.properties.id];
    const colors=region?regionColors[region]:regionColors.sierra;
    return {
        fillColor:colors.fill,
        fillOpacity:0.4,
        color:'white',
        weight:activeDpa==='parroquias'?1:activeDpa==='cantones'?2:3,
        opacity:0.9
    };
}

async function loadDpaLayer(level){
    if(!dpaData[level]){
        const r=await fetch(dpaConfig[level].url);
        dpaData[level]=await r.json();
    }
    dpaLayers[level].clearLayers();
    L.geoJSON(dpaData[level],{
        style:getDpaStyle,
        onEachFeature:function(feature,layer){
            layer.on('mouseover',function(){
                layer.setStyle({fillOpacity:0.75});
                layer.bringToFront();
                const name=feature.properties[dpaConfig[level].prop];
                legendLabelEl.textContent=dpaConfig[level].label;
                legendValueEl.textContent=name||'—';
                legendEl.classList.add('visible');
            });
            layer.on('mouseout',function(){
                layer.setStyle(getDpaStyle(feature));
                legendEl.classList.remove('visible');
            });
            layer.on('click',function(){
                map.fitBounds(layer.getBounds(),{padding:[30,30],maxZoom:14});
            });
        }
    }).addTo(dpaLayers[level]);
}

async function setDpaLevel(level){
    activeDpa=level;
    Object.keys(dpaLayers).forEach(function(k){map.removeLayer(dpaLayers[k])});
    document.querySelectorAll('.dpa-pill').forEach(function(opt){
        opt.classList.toggle('active',opt.querySelector('input').value===level);
    });
    const loading=document.getElementById('brandLoading');
    loading.style.display='block';
    try{
        await loadDpaLayer(level);
        if(activeDpa===level)map.addLayer(dpaLayers[level]);
        return true;
    }catch(error){
        console.error('Error loading DPA layer:',error);
        return false;
    }finally{
        loading.style.display='none';
    }
}

document.querySelectorAll('input[name="dpaLevel"]').forEach(function(input){
    input.addEventListener('change',function(){setDpaLevel(this.value)});
});

function getRegionKey(provCode){
    return provinceRegion[provCode]||null;
}



let ecuadorGeo=null;

async function loadEcuadorGeo(){
    try{
        const r=await fetch(ECUADOR_GEOJSON_URL);
        ecuadorGeo=await r.json();
    }catch(e){
        console.warn("Could not load Ecuador GeoJSON, using fallback");
    }
}

function buildMask(){
    maskLayer.clearLayers();
    if(!ecuadorGeo)return;
    const worldCoords=[[-90,-180],[-90,180],[90,180],[90,-180],[-90,-180]];
    const holes=[];
    ecuadorGeo.features.forEach(function(f){
        const geom=f.geometry;
        if(geom.type==="Polygon"){
            geom.coordinates.forEach(function(ring,i){
                if(i===0) holes.push(ring.map(function(c){return[c[1],c[0]]}));
            });
        }else if(geom.type==="MultiPolygon"){
            geom.coordinates.forEach(function(poly){
                poly.forEach(function(ring,i){
                    if(i===0) holes.push(ring.map(function(c){return[c[1],c[0]]}));
                });
            });
        }
    });
    if(holes.length>0){
        const maskCoords=[worldCoords,...holes];
        L.polygon(maskCoords,{color:'transparent',fillColor:'white',fillOpacity:0.8,weight:0,interactive:false}).addTo(maskLayer);
    }
}

function buildOutline(){
    outlineLayer.clearLayers();
    if(!ecuadorGeo)return;
    try{
        let merged=null;
        ecuadorGeo.features.forEach(function(f){
            if(merged===null){
                merged=f.geometry;
            }else{
                merged=turf.union(merged,f.geometry);
            }
        });
        if(merged){
            L.geoJSON(merged,{
                style:{color:'white',weight:9,fillOpacity:0,opacity:0.95,smoothFactor:1}
            }).addTo(outlineLayer);
        }
    }catch(e){
        console.warn("Could not build outline:",e);
    }
}

let stickyMarker=null;
let currentPopup=null;
let clusterRequest=0;

function openPopupFor(marker,feature){
    closePopup();
    const isCluster=feature.properties.cluster;
    currentPopup=L.popup({maxWidth:320,minWidth:isCluster?0:280})
        .setLatLng(marker.getLatLng())
        .setContent(popup(feature))
        .addTo(map);
    requestAnimationFrame(function(){
        const el=currentPopup.getElement();
        if(!el)return;
        if(isCluster)el.querySelector('.leaflet-popup-content').classList.add('cluster-popup');
        const btn=el.querySelector('.popup-link');
        if(btn){
            btn.addEventListener('click',function(e){
                e.stopPropagation();
                window.open(btn.getAttribute('data-href'),'_blank');
            });
        }
    });
}

function closePopup(){
    if(currentPopup){map.closePopup(currentPopup);currentPopup=null}
}

function createMarkerIcon(){
    return L.divIcon({
        className:"marker-pin",
        iconSize:[80,80],iconAnchor:[40,40],popupAnchor:[0,-42],
        html:'<div style="display:flex;align-items:flex-start;justify-content:center;width:80px;height:80px;padding-top:40px"><svg pointer-events="none" width="28" height="38" viewBox="0 0 28 38" fill="none"><path d="M14 0C6.268 0 0 6.268 0 14c0 10.5 14 24 14 24s14-13.5 14-24C28 6.268 21.732 0 14 0z" fill="#5B2A86"/><circle cx="14" cy="13" r="7" fill="white"/><path d="M14 9v8M10 13h8" stroke="#5B2A86" stroke-width="2" stroke-linecap="round"/></svg></div>'
    });
}

function createClusterIcon(count,size){
    const r=size==='large'?22:size==='medium'?17:13;
    const fs=size==='large'?11:size==='medium'?10:9;
    return L.divIcon({
        className:"cluster-pin",
        iconSize:[r*2,r*2],iconAnchor:[r,r],
        html:'<div style="width:'+r*2+'px;height:'+r*2+'px;background:linear-gradient(135deg,#5B2A86,#3D1A6E);border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:'+fs+'px;border:2px solid white;box-shadow:0 1px 8px rgba(91,42,134,.3);font-family:Nunito,sans-serif">'+count+'</div>'
    });
}

function popup(feature){
    const p=feature.properties;
    const clusterCount=Number(p.cluster_count||0);
    if(clusterCount>1){
        return '<div class="popup-card"><div class="popup-cluster"><div class="popup-cluster-header"><div class="popup-cluster-count">'+clusterCount+'</div><div class="popup-cluster-label">unidades</div></div><div class="popup-cluster-body"><div class="popup-cluster-hint">Click para acercar</div></div></div></div>';
    }
    const regionKey=getRegionKey(p.dpa_prov);
    const region=regionKey?regionNames[regionKey]:'';
    const headerBg=regionKey?'background:'+regionColors[regionKey].fill:'background:linear-gradient(135deg,#5B2A86,#3D1A6E)';
    const headerColor=regionKey?regionColors[regionKey].text:'white';
    let rows='';
    [['RUC',p.ruc],['Modalidad',p.mod],['Servicio',p.servicio],['Provincia',p.dpa_despro],['Cantón',p.dpa_descan],['Área',p.area],['Tipo',p.tipo],['Dirigido a',p.corte]].forEach(function(f){
        if(f[1]) rows+='<div class="popup-row"><span class="label">'+f[0]+'</span><span class="value">'+f[1]+'</span></div>';
    });
    const btnBg=regionKey?regionColors[regionKey].fill:'#5B2A86';
    const dataHref=p.link_ubi?p.link_ubi.replace(/"/g,'&quot;'):'';
    let link=dataHref?('<div style="padding:8px 16px 12px;text-align:center"><button class="popup-link" data-href="'+dataHref+'" style="background:'+btnBg+'">Abrir en Google Maps</button></div>'):'';
    const regionBadge=region?('<span class="popup-tag" style="background:rgba(255,255,255,.25);color:'+regionColors[regionKey].text+';font-weight:600">'+region+'</span>'):'';
    return '<div class="popup-card"><div class="popup-header" style="'+headerBg+';color:'+headerColor+'"><h3>'+p.nombre+'</h3>'+regionBadge+'</div><div class="popup-body">'+rows+'</div>'+link+'</div>';
}

function getBBox(){const b=map.getBounds();return[b.getWest(),b.getSouth(),b.getEast(),b.getNorth()]}

async function updateClusters(){
    const requestId=++clusterRequest;
    const loading=document.getElementById('brandLoading');
    loading.style.display='block';
    closePopup();stickyMarker=null;
    const params=new URLSearchParams({cluster:'true',bbox:getBBox().join(','),zoom:String(Math.floor(map.getZoom()))});
    try{
        const response=await fetch(API+'?'+params.toString());
        if(!response.ok)throw new Error('HTTP '+response.status);
        const collection=await response.json();
        if(requestId!==clusterRequest)return;
        markersLayer.clearLayers();
        const icon=createMarkerIcon();
        collection.features.forEach(function(feature){
            const coordinates=feature.geometry.coordinates;
            const latLng=[coordinates[1],coordinates[0]];
            const count=Number(feature.properties.cluster_count||1);
            let marker;
            if(count>1){
                const size=count>50?'large':count>10?'medium':'small';
                marker=L.marker(latLng,{icon:createClusterIcon(count,size)});
                marker.on('mouseover',function(){marker.openPopup()});
                marker.on('mouseout',function(){marker.closePopup()});
                marker.on('click',function(){map.setView(latLng,Math.min(map.getZoom()+2,map.getMaxZoom()))});
                marker.bindPopup(popup(feature),{maxWidth:320,minWidth:0});
                marker.on('popupopen',function(){
                    const element=marker.getElement();
                    const content=element&&element.querySelector('.leaflet-popup-content');
                    if(content)content.classList.add('cluster-popup');
                });
            }else{
                marker=L.marker(latLng,{icon:icon});
                marker.on('mouseover',function(){
                    if(stickyMarker!==marker)openPopupFor(marker,feature);
                });
                marker.on('mouseout',function(){
                    if(stickyMarker!==marker)closePopup();
                });
                marker.on('click',function(event){
                    L.DomEvent.stopPropagation(event);
                    L.DomEvent.preventDefault(event);
                    if(stickyMarker===marker){
                        closePopup();
                        stickyMarker=null;
                    }else{
                        stickyMarker=marker;
                        openPopupFor(marker,feature);
                    }
                });
            }
            markersLayer.addLayer(marker);
        });
        return true;
    }catch(error){
        if(requestId===clusterRequest)console.error('Error loading map clusters:',error);
        return false;
    }finally{
        if(requestId===clusterRequest)loading.style.display='none';
    }
}

async function reloadData(){
    await updateClusters();
}

map.on('moveend',updateClusters);
map.on('click',function(){
    if(stickyMarker){closePopup();stickyMarker=null}
});

(async function init(){
    ['provincias','cantones','parroquias'].forEach(function(k){dpaLayers[k]=L.layerGroup()});
    loadEcuadorGeo().then(function(){buildMask();buildOutline()});
    try{
        const ready=await Promise.all([setDpaLevel('provincias'),updateClusters(),baseTilesReady]);
        if(ready[0]&&ready[1])window.MapLoading.finish();
        else window.MapLoading.fail('No se pudieron cargar las capas de unidades.');
    }catch(error){
        console.error('Error initializing map:',error);
        window.MapLoading.fail('Comprueba la conexión e inténtalo de nuevo.');
    }
})();
</script>
</body>
</html>

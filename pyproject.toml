[project]
name = "api-rest-geo"
version = "0.1.0"
description = "API REST para información geográfica con unidades de atención"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.3",
    "pydantic-settings==2.9.1",
    "python-dotenv==1.1.0",
    "sqlalchemy[asyncio]==2.0.41",
    "aiosqlite==0.21.0",
    "asyncpg==0.30.0",
    "slowapi==0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.1",
    "pytest-asyncio==0.25.3",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

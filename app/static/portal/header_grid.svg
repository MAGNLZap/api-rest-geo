<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 390" fill="none" aria-hidden="true">
  <defs>
    <pattern id="square-grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" stroke="#147c83" stroke-opacity=".28" stroke-width="1.3"/>
    </pattern>
    <radialGradient id="grid-fade" cx="50%" cy="58%" r="76%">
      <stop offset="0" stop-color="#fff" stop-opacity=".92"/>
      <stop offset=".52" stop-color="#fff" stop-opacity=".62"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".08"/>
    </radialGradient>
    <mask id="grid-mask">
      <rect width="1180" height="390" fill="url(#grid-fade)"/>
    </mask>
  </defs>
  <rect width="1180" height="390" fill="url(#square-grid)" mask="url(#grid-mask)"/>
</svg>

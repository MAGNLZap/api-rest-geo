name: apirestgeo

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: apirestgeo-api:local
    env_file:
      - .env.production
    environment:
      ENVIRONMENT: production
      HOST: 0.0.0.0
      PORT: "8001"
      ROOT_PATH: /api-geo
      ALLOW_LOCAL_NETWORK: "false"
      FORWARDED_ALLOW_IPS: 172.30.40.10
    restart: unless-stopped
    networks:
      - geo

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: production
      args:
        PUBLIC_BASE: /api-geo/
        API_BASE: /api-geo
    image: apirestgeo-web:local
    environment:
      PUBLIC_PATH: /api-geo
      API_UPSTREAM: api:8001
      PUBLIC_SCHEME: ${PUBLIC_SCHEME:-http}
      TRUSTED_PROXY_CIDR: 172.30.40.1/32
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      geo:
        ipv4_address: 172.30.40.10

networks:
  geo:
    ipam:
      config:
        - subnet: 172.30.40.0/24
